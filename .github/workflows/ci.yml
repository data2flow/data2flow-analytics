# CI 단계는 조직 공용 재사용 워크플로에 한 번만 정의한다
name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# 호출되는 공용 워크플로가 요구하는 권한을 여기서 준다(없으면 startup_failure). 패키지 쓰기는 GHCR·GitHub Packages push용
permissions:
  contents: read
  packages: write
jobs:
  ci:
    uses: data2flow/.github/.github/workflows/python-service.yml@v1
    with:
      app-name: data2flow-analytics
    secrets: inherit
